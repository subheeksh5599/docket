<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.2  0 0 0 0 0.2  0 0 0 0.05 0"/>
    </filter>
    <pattern id="dots" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="0.6" cy="0.6" r="0.5" fill="#2e3138"/>
    </pattern>
  </defs>

  <!-- paper background -->
  <rect width="1440" height="760" fill="#f2f0ea"/>
  <rect width="1440" height="760" filter="url(#noise)" opacity="0.4"/>

  <!-- header hairline -->
  <rect x="0" y="0" width="1440" height="56" fill="#faf9f5"/>
  <rect x="0" y="56" width="1440" height="1" fill="#d8d5cc"/>
  <circle cx="36" cy="28" r="5" fill="#c6d452"/>
  <text x="52" y="33" font-family="monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#1d1f24">DOCKET</text>
  <text x="1250" y="33" font-family="monospace" font-size="11" letter-spacing="2" fill="#8a877e">ASK · RECEIPTS · WHY TRUST THIS</text>

  <!-- hero left: copy -->
  <text x="80" y="150" font-family="monospace" font-size="11" letter-spacing="3" fill="#8a877e">PUT A QUESTION ON THE RECORD</text>
  <text x="80" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#1d1f24">Ask the network.</text>
  <text x="80" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="#1d1f24">Mint the receipt.</text>
  <text x="80" y="345" font-family="monospace" font-size="15" fill="#55534c">Real Telegraph miner → ERC-8183 job → callback mints</text>
  <text x="80" y="370" font-family="monospace" font-size="15" fill="#55534c">an immutable, on-chain receipt. No screenshots. No files.</text>

  <!-- CTA buttons -->
  <rect x="80" y="410" width="180" height="42" rx="3" fill="#1d1f24"/>
  <text x="170" y="437" font-family="monospace" font-size="12" letter-spacing="1.5" fill="#f2f0ea" text-anchor="middle">ASK A QUESTION</text>
  <rect x="276" y="410" width="180" height="42" rx="3" fill="none" stroke="#1d1f24" stroke-width="1.5"/>
  <text x="366" y="437" font-family="monospace" font-size="12" letter-spacing="1.5" fill="#1d1f24" text-anchor="middle">VIEW RECEIPTS</text>

  <!-- receipt panel (right): real data, 1-bit card -->
  <rect x="820" y="120" width="540" height="520" rx="3" fill="#faf9f5" stroke="#d8d5cc"/>
  <rect x="820" y="120" width="540" height="48" rx="3" fill="#efede6"/>
  <text x="848" y="149" font-family="monospace" font-size="11" letter-spacing="2" fill="#55534c">RECEIPT #28 — ON THE RECORD</text>
  <circle cx="1300" cy="144" r="5" fill="#c6d452"/>
  <text x="1312" y="149" font-family="monospace" font-size="11" letter-spacing="1.5" fill="#1d1f24">MINTED</text>

  <!-- rows -->
  <g font-family="monospace" font-size="13">
    <text x="848" y="200" fill="#8a877e" letter-spacing="1.5">REGISTRY</text>
    <text x="1040" y="200" fill="#1d1f24">0xb5Ed97b4…528BBf48</text>
    <line x1="848" y1="222" x2="1332" y2="222" stroke="#e5e2da"/>
    <text x="848" y="252" fill="#8a877e" letter-spacing="1.5">INTENT</text>
    <text x="1040" y="252" fill="#1d1f24">CRYPTO_PRICE</text>
    <line x1="848" y1="274" x2="1332" y2="274" stroke="#e5e2da"/>
    <text x="848" y="304" fill="#8a877e" letter-spacing="1.5">QUESTION HASH</text>
    <text x="1040" y="304" fill="#1d1f24">0x4cbd14b1…71ebe0d</text>
    <line x1="848" y1="326" x2="1332" y2="326" stroke="#e5e2da"/>
    <text x="848" y="356" fill="#8a877e" letter-spacing="1.5">ANSWER COMMITMENT</text>
    <text x="1040" y="356" fill="#1d1f24">0x23d1c6ef…280d44c2</text>
    <line x1="848" y1="378" x2="1332" y2="378" stroke="#e5e2da"/>
    <text x="848" y="408" fill="#8a877e" letter-spacing="1.5">RESOLVED</text>
    <text x="1040" y="408" fill="#1d1f24">true</text>
    <line x1="848" y1="430" x2="1332" y2="430" stroke="#e5e2da"/>
    <text x="848" y="460" fill="#8a877e" letter-spacing="1.5">TIMESTAMP</text>
    <text x="1040" y="460" fill="#1d1f24">1788416504 (2026-09-03)</text>
  </g>

  <!-- verified footer strip -->
  <rect x="848" y="500" width="484" height="52" rx="3" fill="#c6d452" opacity="0.25"/>
  <text x="870" y="531" font-family="monospace" font-size="12" letter-spacing="1.5" fill="#1d1f24">✓ VERIFIED ON-CHAIN — re-hashable, immutable, no DOCKET required</text>

  <!-- footer -->
  <rect x="0" y="704" width="1440" height="1" fill="#d8d5cc"/>
  <text x="80" y="736" font-family="monospace" font-size="10" letter-spacing="2" fill="#8a877e">DOCKET RECORDS WHAT THE NETWORK RETURNED. NEVER DECLARES TRUTH.</text>
  <text x="1180" y="736" font-family="monospace" font-size="10" letter-spacing="2" fill="#8a877e">BASE SEPOLIA · TELEGRAPH ERC-8183</text>
</svg>
