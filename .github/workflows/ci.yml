name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Contracts (forge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install forge deps
        run: forge install foundry-rs/forge-std --no-commit
      - name: Check formatting
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Run tests (unit + edge + vectors, excludes fork which needs a local anvil)
        run: forge test --no-match-path 'test/Fork.t.sol'
      - name: Run invariant suite (bounded)
        env:
          FOUNDRY_INVARIANT_RUNS: "128"
          FOUNDRY_INVARIANT_DEPTH: "16"
        run: forge test --match-path test/Invariant.t.sol

  frontend:
    name: Frontend (vite + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_REGISTRY_ADDRESS: 0xb5Ed97b4F10da09B9b54594925F0Ba5b528BBf48
