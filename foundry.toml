[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Pin the exact compiler used for the live deployment (Blockscout: v0.8.28) so
# clean-clone builds reproduce bytecode, not just behavior.
solc_version = "0.8.28"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
via_ir = true
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
base_sepolia_fork = "http://localhost:8545"
